name: "🛠️ Task / feature"
description: Planned work, sized for one person in one week or less
title: "[Task] "
labels: ["task"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a pilot, I want ..., so that ...
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (how we will test it)
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] Measured: glass-to-glass latency ≤ 200 ms (median of 10 photos)
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Pilot GUI / web app, Video streaming / cameras, Control, Electrical, Mechanical, Documentation]
  - type: textarea
    id: notes
    attributes: { label: Notes, links, measurements }
