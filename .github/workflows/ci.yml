name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: pip install -r encoding_lab/requirements.txt pytest

      - name: Syntax check (Python and shell)
        run: |
          python -m compileall -q encoding_lab build docs
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done

      - name: Health-check script tests
        run: bash docs/debug/test_healthcheck.sh

      - name: Encoding Lab engine tests
        working-directory: encoding_lab
        run: python -m pytest -q tests
