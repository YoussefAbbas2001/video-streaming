<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass-to-glass latency clock</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: "Courier New", monospace; overflow: hidden; }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; }
  #clock { font-size: 15vw; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  #ms { color: #ff3b3b; }
  #frame { font-size: 1.8vw; color: #9fb3c8; text-align: center; font-family: Arial, sans-serif; }
  #bar { width: 80vw; height: 4vh; background: #222; position: relative; border-radius: 1vh; overflow: hidden; }
  #tick { position: absolute; top: 0; bottom: 0; width: 2vw; background: #22d3ee; }
  #help { position: fixed; bottom: 1.5vh; font-size: 1.4vw; color: #555; text-align: center; width: 100%; font-family: Arial, sans-serif; }
</style>
</head>
<body>
<div id="wrap">
  <div id="clock">00:00.<span id="ms">000</span></div>
  <div id="bar"><div id="tick"></div></div>
  <div id="frame">display frame 0 · refresh ≈ – Hz</div>
</div>
<div id="help">Point the ROV camera at this screen · show the received video next to it · take 10+ photos · latency = this clock − the clock inside the video · press F for full screen</div>
<script>
  // Millisecond clock for glass-to-glass latency measurement. Each photo of (this screen + the received video)
  // gives one latency sample. The moving bar helps when digits blur: its position also encodes time (1 s per sweep).
  const clock = document.getElementById("clock"), msEl = document.getElementById("ms");
  const tick = document.getElementById("tick"), frameEl = document.getElementById("frame");
  let frames = 0, last = performance.now(), hz = 0;
  function draw(now) {
    const t = Date.now();
    const d = new Date(t);
    const mm = String(d.getMinutes()).padStart(2, "0"), ss = String(d.getSeconds()).padStart(2, "0");
    clock.firstChild.nodeValue = `${mm}:${ss}.`;
    msEl.textContent = String(d.getMilliseconds()).padStart(3, "0");
    tick.style.left = `${(t % 1000) / 1000 * 98}%`;
    frames++;
    if (now - last >= 1000) { hz = Math.round(frames * 1000 / (now - last)); frames = 0; last = now; }
    frameEl.textContent = `screen refresh ≈ ${hz} Hz · one refresh = ${hz ? (1000 / hz).toFixed(1) : "–"} ms of uncertainty per photo`;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  document.addEventListener("keydown", (e) => {
    if (e.key === "f" || e.key === "F") {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.();
    }
  });
</script>
</body>
</html>
